stages:
  - build
  - release

smdc_portal_rust_testing:
  stage: .pre
  image: ubuntu:24.04
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Testing the project..."
    - apt update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget unzip
    - apt-get install -y file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    - apt-get install -y libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    - curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
    - chmod +x rustup-init.sh
    - ./rustup-init.sh -y --no-modify-path
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo test --manifest-path src-tauri/Cargo.toml

smdc_portal_javascript_testing:
  stage: .pre
  image: ubuntu:24.04
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Testing the project..."
    - apt update
    - apt-get install -y build-essential curl wget unzip libssl-dev
    - curl -SLO https://deb.nodesource.com/nsolid_setup_deb.sh
    - rm -f /usr/share/keyrings/nodesource.gpg
    - chmod 500 nsolid_setup_deb.sh
    - ./nsolid_setup_deb.sh 23
    - apt-get install nodejs -y
    - curl -fsSL https://bun.sh/install -o bun-installer.sh
    - chmod +x bun-installer.sh
    - ./bun-installer.sh
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun install
    - bun x playwright install --with-deps chromium
    - bun run test.e2e

semantic_release:
  stage: build
  image: node:25
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      echo '{"name": "smdc_portal", "version": "0.0.0-development", "private": true}' > package.json
      cat > .releaserc.cjs << 'EOF'
      module.exports = {
        branches: ['main'],
        plugins: [
          '@semantic-release/commit-analyzer',
          '@semantic-release/release-notes-generator',
          [
            '@semantic-release/npm',
            {
              npmPublish: false
            }
          ],
          [
            '@semantic-release/exec',
            {
              publishCmd: [
                'echo "Creating GitLab release for version ${nextRelease.version}"',
                'echo "${nextRelease.notes}" | sed \':a;N;$!ba;s/\\n/\\\\n/g\' | sed \'s/"/\\\\"/g\' > escaped_notes.txt',
                'ESCAPED_NOTES=$(cat escaped_notes.txt)',
                'curl -k ' +
                '--header "Content-Type: application/json" ' +
                '--header "JOB-TOKEN: $CI_JOB_TOKEN" ' +
                '--data "{ ' +
                    '\\"name\\": \\"Release v${nextRelease.version}\\", ' +
                    '\\"tag_name\\": \\"v${nextRelease.version}\\", ' +
                    '\\"ref\\": \\"$CI_COMMIT_SHA\\", ' +
                    '\\"description\\": \\"$ESCAPED_NOTES\\", ' +
                    '\\"assets\\": { ' +
                      '\\"links\\": [' +
                        '{ ' +
                          '\\"name\\": \\"smdc_portal\\", ' +
                          '\\"url\\": \\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/smdc_portal/v${nextRelease.version}/smdc_portal\\" ' +
                        '}, ' +
                        '{ ' +
                          '\\"name\\": \\"smdc_portal.exe\\", ' +
                          '\\"url\\": \\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/smdc_portal/v${nextRelease.version}/smdc_portal.exe\\" ' +
                        '}' +
                      '] ' +
                    '} ' +
                  '}" ' +
                '--request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"'
              ].join(' && ')
            }
          ]
        ]
      };
      EOF
    - git config --global http.sslVerify false
    - export NODE_TLS_REJECT_UNAUTHORIZED=0
    - npm install --no-save semantic-release @semantic-release/exec
    - |
      # Run semantic-release and capture output to determine if release was created
      set +e  # Don't exit on error
      SEMANTIC_OUTPUT=$(npx semantic-release 2>&1)
      SEMANTIC_EXIT_CODE=$?
      set -e  # Re-enable exit on error
      
      echo "$SEMANTIC_OUTPUT"
      
      if [ $SEMANTIC_EXIT_CODE -eq 0 ] && echo "$SEMANTIC_OUTPUT" | grep -q "Published release"; then
        echo "New release created successfully"
        if [ -f package.json ]; then
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" > version.env
          echo "NEW_RELEASE=true" >> version.env
          echo "Generated version: $VERSION"
        else
          echo "VERSION=latest" > version.env
          echo "NEW_RELEASE=true" >> version.env
        fi
      elif [ $SEMANTIC_EXIT_CODE -eq 0 ] && echo "$SEMANTIC_OUTPUT" | grep -q "no new version is released"; then
        echo "No new release created - no relevant changes found"
        echo "VERSION=latest" > version.env
        echo "NEW_RELEASE=false" >> version.env
      else
        echo "Semantic-release failed or encountered an error"
        echo "VERSION=latest" > version.env
        echo "NEW_RELEASE=false" >> version.env
      fi
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 hour
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN
    NPM_TOKEN: "dummy-token"
    NODE_TLS_REJECT_UNAUTHORIZED: "0"

smdc_portal_build_linux:
  stage: release
  image: docker:28.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375/
  services:
    - name: docker:28.5.1-dind
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - until docker info; do sleep 1; done
    - |
      # Only proceed if a new release was actually created
      if [ "$NEW_RELEASE" != "true" ]; then
        echo "No new release was created by semantic-release, skipping Docker build"
        exit 0
      fi
      echo "New release detected, proceeding with Docker build"
  script:
    - echo "Building the project..."
    - apk update
    - apk add unzip curl wget
    - curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
    - export PATH="$HOME/.local/bin:$PATH"
    - cd .ci
    - dagger call linux --src=../ export --path="$(dirname $(pwd))/exe/smdc_portal"
  artifacts:
    paths:
      - exe/smdc_portal
  needs:
    - semantic_release

smdc_portal_build_windows:
  stage: release
  image: docker:28.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375/
  services:
    - name: docker:28.5.1-dind
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - until docker info; do sleep 1; done
    - |
      # Only proceed if a new release was actually created
      if [ "$NEW_RELEASE" != "true" ]; then
        echo "No new release was created by semantic-release, skipping Docker build"
        exit 0
      fi
      echo "New release detected, proceeding with Docker build"
  script:
    - echo "Building the project..."
    - apk update
    - apk add unzip curl wget
    - curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
    - export PATH="$HOME/.local/bin:$PATH"
    - cd .ci
    - dagger call windows --src=../ export --path="$(dirname $(pwd))/exe/smdc_portal.exe"
  artifacts:
    paths:
      - exe/smdc_portal.exe
  needs:
    - semantic_release

smdc_portal_upload_package:
  stage: .post
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - |
      # Only proceed if a new release was actually created
      if [ "$NEW_RELEASE" != "true" ]; then
        echo "No new release was created by semantic-release, skipping Docker build"
        exit 0
      fi
      echo "New release detected, proceeding with Docker build"
  script:
    # Get the latest tag created by semantic-release
    - apk update
    - apk add --no-cache curl git
    - git config --global http.sslVerify false
    - RELEASE_TAG=$(git describe --tags --abbrev=0)
    - 'curl -k --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file exe/smdc_portal "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/smdc_portal/${RELEASE_TAG}/smdc_portal"'
    - 'curl -k --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file exe/smdc_portal.exe "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/smdc_portal/${RELEASE_TAG}/smdc_portal.exe"'
  needs:
    - semantic_release
    - smdc_portal_build_linux
    - smdc_portal_build_windows

