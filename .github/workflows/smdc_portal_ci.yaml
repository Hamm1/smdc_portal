name: smdc_portal_ci

on:
  push:
    # branches:
    #   - 'main'
    tags:
      - 'v*'
  pull_request:
    # branches:
    #   - '**'

jobs:
  once:
    name: Create GitHub release
    runs-on: 'ubuntu-latest'
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Automated Release by GitHub Action CI
          draft: false
          prerelease: false

  build:
    needs: once
    strategy:
      matrix:
        #platform: [ubuntu-latest, windows-latest, macos-latest]
        platform: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.platform }}
        
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 21
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: install Rust
        if: matrix.platform != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Package install Windows
        if: matrix.platform == 'windows-latest'
        run: npm install @tauri-apps/cli-win32-x64-msvc

      - name: Package install MacOS
        if: matrix.platform == 'macos-latest'
        run: npm install @tauri-apps/cli-darwin-x64

      - name: Package install Ubuntu
        if: matrix.platform == 'ubuntu-latest'
        run: |
          npm install @tauri-apps/cli-linux-x64-gnu \
          && sudo apt update \
          && sudo apt install libdbus-1-dev pkg-config \
          zlib1g libevent-dev libwebkit2gtk-4.0-dev \
          build-essential curl wget libssl-dev \
          libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          librsvg2-dev libfuse2 libappindicator3-dev libwebkit2gtk-4.1-dev \
          patchelf

      - name: Run build
        run: |
          npm run build

      - name: Upload Release Asset (x64) Ubuntu
        id: upload-release-asset-x64
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.once.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/smdc-portal
          asset_name: SMDC-Portal
          asset_content_type: application/executable

      - name: Upload Release Asset (x64) Windows
        id: upload-release-asset-x64-windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.once.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/smdc_portal.exe
          asset_name: SMDC-Portal.exe
          asset_content_type: application/executable

      - name: Upload Release Asset (x64) Windows
        id: upload-release-asset-x64-windows_msi
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.once.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/bundle/msi/smdc_portal_0.1.0_x64_en-US.msi
          asset_name: SMDC-Portal.msi
          asset_content_type: application/executable

      - name: Upload Release Asset (x64) MacOS
        id: upload-release-asset-x64-macos
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.once.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/smdc-portal
          asset_name: SMDC-Portal-Darwin
          asset_content_type: application/executable
