name: smdc_portal_ci

on:
  push:
    branches:
      - 'main'

jobs:
  rust:
    name: Run Cargo Tests
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v4

      - name: Dagger Rust tests
        run: |
          sudo apt update && sudo apt install curl unzip wget;
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh;
          export PATH="$HOME/.local/bin:$PATH";
          cd .ci
          dagger call tests --src=../

  bun:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dagger Playwright tests
        run: |
          sudo apt update && sudo apt install curl unzip wget;
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh;
          export PATH="$HOME/.local/bin:$PATH";
          cd .ci
          dagger call playwright --src=../

  build:
    needs: [bun, rust]
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Package install Windows
        if: matrix.platform == 'windows-latest'
        run: bun install @tauri-apps/cli-win32-x64-msvc --force

      - name: Package install Ubuntu
        if: matrix.platform == 'ubuntu-latest'
        run: |
          bun install @tauri-apps/cli-linux-x64-gnu --force \
          && sudo apt update \
          && sudo apt install libdbus-1-dev pkg-config \
          zlib1g libevent-dev \
          build-essential curl wget libssl-dev \
          libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          librsvg2-dev libfuse2 libappindicator3-dev libwebkit2gtk-4.1-dev \
          patchelf

      - name: Run build
        run: bun run build:bun

      - name: Upload Ubuntu binary
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: ./src-tauri/target/release/smdc_portal

      - name: Upload Windows binaries
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ./src-tauri/target/release/smdc_portal.exe
            ./src-tauri/target/release/bundle/msi/smdc_portal_0.1.0_x64_en-US.msi

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    environment: production

    outputs:
      release_created: ${{ steps.semantic_release.outputs.release_created }}
      version: ${{ steps.semantic_release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./artifacts/

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: ./artifacts/

      - name: Make Linux binary executable
        run: chmod +x ./artifacts/smdc_portal

      - name: Create semantic-release config
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              [
                "@semantic-release/npm",
                {
                  "npmPublish": false
                }
              ],
              [
                "@semantic-release/github",
                {
                  "assets": [
                    {
                      "path": "artifacts/smdc_portal",
                      "name": "smdc_portal",
                      "label": "smdc_portal"
                    },
                    {
                      "path": "artifacts/smdc_portal.exe",
                      "name": "smdc_portal.exe",
                      "label": "smdc_portal.exe"
                    },
                    {
                      "path": "artifacts/smdc_portal_0.1.0_x64_en-US.msi",
                      "name": "smdc_portal.msi",
                      "label": "smdc_portal.msi"
                    }
                  ]
                }
              ]
            ]
          }
          EOF
          echo '{"name": "smdc_portal", "version": "0.0.0-development", "private": true}' > package.json

      - name: Release on GitHub with assets
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "dummy-token"
