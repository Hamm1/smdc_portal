name: smdc_portal_ci

on:
  push:
    branches:
      - 'main'
    tags:
      - "release-v[0-9]+.[0-9]+.[0-9]+"
      - "release-v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: 'ubuntu-latest'
    env:
      TRIGGER_TAG: ${{ github.ref }}
      TRIGGER_TAG_NAME: ${{ github.ref_name }}
      IS_DRY_RUN: false
      GIT_USERNAME: hamm1
      GIT_EMAIL: mlhambright1@gmail.com

    outputs:
      release_tag: ${{ steps.compute_tag.outputs.release_tag }}
      is_pre_release: ${{ steps.compute_tag.outputs.is_pre_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git author information
        run: |
          set -ue
          git config --global user.email "${GIT_EMAIL}"
          git config --global user.name "${GIT_USERNAME}"

      - name: Compute release tag
        id: compute_tag
        run: |
          set -xue
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Triggered by tag push: ${GITHUB_REF}"
            RELEASE_TAG="${GITHUB_REF#*release-}"
          else
            echo "Triggered by main push"
            latest_tag=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
            echo "Latest published tag is: $latest_tag"
            if [ -z "$latest_tag" ]; then
              new_version="0.0.1"
            else
              version=${latest_tag#v}
              IFS='.' read -r major minor patch <<< "$version"
              patch=$((patch + 1))
              new_version="${major}.${minor}.${patch}"
            fi
            RELEASE_TAG="v${new_version}"
          fi

          IS_PRE_RELEASE=false
          if echo "${RELEASE_TAG}" | grep -E -- '-rc[0-9]+$'; then
            IS_PRE_RELEASE=true
          fi

          if [[ -n $(git tag -l | grep -E -- '^'${RELEASE_TAG}) ]]; then
            echo "::error::Release tag ${RELEASE_TAG} already exists in repository. Refusing to continue."
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "is_pre_release=${IS_PRE_RELEASE}" >> $GITHUB_OUTPUT

      - name: Creating the release tag
        run: |
          set -ue
          if [[ "$IS_DRY_RUN" == "true" ]]; then
            echo "IS_DRY_RUN=${IS_DRY_RUN}"
            exit 0
          fi
          echo "Creating release tag ${{ steps.compute_tag.outputs.release_tag }}"
          git tag ${{ steps.compute_tag.outputs.release_tag }}
          git push origin ${{ steps.compute_tag.outputs.release_tag }}

      - name: Deleting pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -ue
          echo "Deleting pushed tag ${TRIGGER_TAG_NAME}"
          git tag -d ${TRIGGER_TAG_NAME}
          git push -d origin ${TRIGGER_TAG_NAME}

  build:
    needs: prepare
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Package install Windows
        if: matrix.platform == 'windows-latest'
        run: bun install @tauri-apps/cli-win32-x64-msvc --force

      - name: Package install Ubuntu
        if: matrix.platform == 'ubuntu-latest'
        run: |
          bun install @tauri-apps/cli-linux-x64-gnu --force \
          && sudo apt update \
          && sudo apt install libdbus-1-dev pkg-config \
          zlib1g libevent-dev \
          build-essential curl wget libssl-dev \
          libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          librsvg2-dev libfuse2 libappindicator3-dev libwebkit2gtk-4.1-dev \
          patchelf

      - name: Run build
        run: bun run build:bun

      - name: Upload Ubuntu binary
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: ./src-tauri/target/release/smdc_portal

      - name: Upload Windows binaries
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ./src-tauri/target/release/smdc_portal.exe
            ./src-tauri/target/release/bundle/msi/smdc_portal_0.1.0_x64_en-US.msi

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_pre_release }}
          files: |
            ./artifacts/linux-binary/smdc_portal
            ./artifacts/windows-binaries/smdc_portal.exe
            ./artifacts/windows-binaries/smdc_portal_0.1.0_x64_en-US.msi