name: smdc_portal_tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Run Cargo Tests
    runs-on: ubuntu-latest
   
    steps:
      - uses: actions/checkout@v4

      - name: Dagger Rust Tests
        run: |
          apk update;
          apk add unzip curl wget;
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh;
          export PATH="$HOME/.local/bin:$PATH";
          cd .ci;
          dagger call tests --src=../;

  bun:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Install minimal Alpine dependencies
        run: |
          apk add --no-cache \
            git \
            chromium \
            nss \
            freetype \
            harfbuzz \
            ca-certificates \
            ttf-freefont

      - uses: actions/checkout@v4
      
      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          
      - name: Install dependencies
        run: bun install --ignore-scripts
        
      # - name: Install Playwright Browsers
      #   run: bun x playwright install
        
      - name: Create Alpine Playwright config (CommonJS)
        run: |
          cat > playwright.config.alpine.cjs << 'EOF'
          const { defineConfig, devices } = require('@playwright/test');
          
          module.exports = defineConfig({
            testDir: './tests',
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: 'html',
            
            use: {
              baseURL: 'http://127.0.0.1:5173',
              trace: 'on-first-retry',
            },

            projects: [
              {
                name: 'chromium',
                use: { 
                  ...devices['Desktop Chrome'],
                  launchOptions: {
                    executablePath: '/usr/bin/chromium-browser',
                    args: [
                      '--no-sandbox',
                      '--disable-setuid-sandbox',
                      '--disable-dev-shm-usage',
                      '--disable-background-timer-throttling',
                      '--disable-backgrounding-occluded-windows',
                      '--disable-renderer-backgrounding',
                      '--disable-features=TranslateUI',
                      '--disable-extensions',
                      '--mute-audio',
                      '--no-first-run',
                      '--disable-gpu',
                      '--headless=new'
                    ]
                  }
                }
              }
            ],

            webServer: {
              command: 'bun run preview',
              port: 5173,
              reuseExistingServer: !process.env.CI,
            },
          });
          EOF

      - name: Run Playwright tests with Alpine config
        run: bun x playwright test --config=playwright.config.alpine.cjs
